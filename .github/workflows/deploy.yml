# Builds the game with Vite and publishes the `dist` folder to GitHub Pages.
#
# One-time setup in the GitHub website:
#   Repository -> Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions
#
# After that, every push to `main` redeploys the site automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows running it by hand from the Actions tab

# Permissions the deploy job needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at the same time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
